name: Publish

# Tag a release and npm gets it: no token, no one-time password. npm exchanges the
# workflow's OIDC identity for publish rights, so the only setup is the trusted
# publisher registered on the package (see the README's release notes).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for trusted publishing: without it npm has no identity to exchange.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  # Never interrupt a run that may already be uploading.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # Only the public repository publishes. This same file travels into a mirror
    # of it, and a tag pushed to a mirror would otherwise start a publish there:
    # npm's trusted publisher is registered for one repository, so the exchange
    # would fail, but the run has no business starting at all.
    if: github.repository == 'kangtsang/dsh-worktree-space'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      # Node 24 ships npm 11; the OIDC exchange needs npm 11.5.1 or newer, which
      # Node 22's bundled npm is not. registry-url is what npm reads the identity
      # through, and no NODE_AUTH_TOKEN is involved.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      # Has this version already been published?
      #
      # Moving a tag that was published before is a real operation - it happens when
      # the public line is rebuilt so its history is whole again - and GitHub treats a
      # forced tag push as a new event, so this workflow starts and walks all the way to
      # `npm publish` before npm refuses. The refusal is correct and the version on
      # npm is untouched, but it leaves a red run that reads like a failed release.
      #
      # So the question is asked here instead, where answering it is cheap: the registry
      # is the authority on what exists, not this repository. Finding it is not a
      # problem - it is what a re-publish would look like from the start, and npm would
      # refuse it anyway.
      #
      # A found version exits 0 and publishes nothing. That is deliberate: the tag move
      # was made on purpose, the version is already out, and the run records what it
      # found rather than failing over something that is not wrong.
      - name: Check that this version is not already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-worktree-space@$version" version >/dev/null 2>&1; then
            echo "::notice::dsh-worktree-space@$version is already published; nothing to do."
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          else
            echo "dsh-worktree-space@$version is not on npm yet."
            echo "ALREADY_PUBLISHED=0" >> "$GITHUB_ENV"
          fi

      # The package's prepublishOnly script runs the project gate, so a failing
      # test or a stale bundle stops the publish here.
      - name: Publish
        if: env.ALREADY_PUBLISHED == '0'
        run: npm publish
