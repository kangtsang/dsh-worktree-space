<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    The plugin's mark for the plugin list and the plugin's own page: the glyph alone, in
    the blue the list draws it, with nothing behind it. It is the drawing `BrandGlyph`
    makes — the lucide folder-git-2 the plugin shipped before it moved to Hugeicons — at
    that component's own weight, so the mark the list shows is the mark the panel list,
    the footer and the workspace selector already lead with.

    The glyph itself is drawn at 0.8 of the box (20 of the 24 units), because the list
    draws every plugin's mark in one square: a drawing that fills its box edge to edge
    reads larger than the neighbours that leave a margin. Change the 0.8 to make it
    smaller or larger; nothing else needs to move.
  -->
  <g transform="translate(2.4 2.4) scale(0.8)">
    <path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5" />
    <circle cx="13" cy="12" r="2" />
    <path d="M18 19c-2.8 0-5-2.2-5-5v8" />
    <circle cx="20" cy="19" r="2" />
  </g>
</svg>
