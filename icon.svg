<svg xmlns="http://www.w3.org/2000/svg" width="510" height="510" viewBox="0 0 510 510" fill="none">
  <!--
    The plugin's mark for the plugin list and the plugin's own page: a rounded tile
    filled with the three-stop gradient, carrying the folder-git2 glyph the entries
    draw on their own. Reproduced from the artwork, whose geometry is the tile
    510x510 at radius 40 and the glyph 320x320 centered on it (its 600x600 page box
    was padding, 45 on each side, and is not part of the mark).
  -->
  <defs>
    <linearGradient id="dws-plugin-mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.1" stop-color="#fee7a8" />
      <stop offset="0.36" stop-color="#ffeda0" />
      <stop offset="0.64" stop-color="#efa5ff" />
    </linearGradient>
  </defs>
  <rect width="510" height="510" rx="40" fill="url(#dws-plugin-mark)" />
  <g transform="translate(95 95) scale(13.333333)" fill="none" stroke="#030303" stroke-width="1.22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5" />
    <circle cx="13" cy="12" r="2" />
    <path d="M18 19c-2.8 0-5-2.2-5-5v8" />
    <circle cx="20" cy="19" r="2" />
  </g>
</svg>
